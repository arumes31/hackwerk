name: hackwerk-routing

services:
  osrm:
    image: ${OSRM_IMAGE:?OSRM_IMAGE mit unveraenderlichem Digest setzen}
    command: ["osrm-routed", "--threads", "2", "--algorithm", "mld", "--mmap", "--max-table-size", "25", "/data/current/route.osrm"]
    volumes:
      - type: bind
        source: ${OSRM_DATA_DIR:?OSRM_DATA_DIR setzen}
        target: /data
        read_only: true
    ports:
      - 127.0.0.1:${OSRM_PORT:-5000}:5000
    networks: [routing]
    read_only: true
    user: "65532:65532"
    tmpfs: ["/tmp:size=32m,mode=1777,noexec,nosuid,nodev"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 128
    cpus: "1.50"
    mem_limit: 2g
    memswap_limit: 3g
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --max-time 5 'http://127.0.0.1:5000/route/v1/driving/14.2858,48.3069;14.3000,48.3100?overview=false' | grep -q '\"code\":\"Ok\"'"]
      interval: 15s
      timeout: 6s
      retries: 8
      start_period: 30s
    profiles: [routing]
    restart: unless-stopped

  osrm-update:
    image: ${OSRM_IMAGE:?OSRM_IMAGE mit unveraenderlichem Digest setzen}
    command: ["ionice", "-c", "3", "nice", "-n", "15", "/usr/local/bin/hackwerk-osrm-update"]
    environment:
      OSRM_DATA_ROOT: /data
      OSRM_BBOX: ${OSRM_BBOX:-9.4,46.3,17.5,49.5}
      OSRM_MIN_FREE_KB: ${OSRM_MIN_FREE_KB:-20971520}
      OSRM_THREADS: ${OSRM_THREADS:-2}
      OSRM_DOWNLOAD_LIMIT: ${OSRM_DOWNLOAD_LIMIT:-4M}
    volumes:
      - type: bind
        source: ${OSRM_DATA_DIR:?OSRM_DATA_DIR setzen}
        target: /data
    networks: [egress]
    read_only: true
    user: "65532:65532"
    tmpfs: ["/tmp:size=64m,mode=1777,noexec,nosuid,nodev"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 512
    cpus: "2.00"
    mem_limit: 8g
    memswap_limit: 10g
    profiles: [osrm-ops]
    restart: "no"

networks:
  routing:
    internal: true
  egress:
