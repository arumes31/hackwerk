name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: hackplan_test
          POSTGRES_USER: hackplan
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hackplan -d hackplan_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://hackplan:test-only@localhost:5432/hackplan_test?sslmode=disable
      APP_ENV: test
      APP_BASE_URL: http://localhost:18533
      DATABASE_URL: postgres://hackplan:test-only@localhost:5432/hackplan_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.0
          cache: true
      - run: make release-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hackwerk-sbom
          path: dist/hackwerk.*.json
          if-no-files-found: warn
