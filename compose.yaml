name: hackwerk

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: hackplan_bootstrap
      POSTGRES_PASSWORD: development-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackplan_bootstrap -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./scripts/postgres/init.sql:/docker-entrypoint-initdb.d/10-hackplan.sql:ro
    networks: [backend]

  migrate:
    build: &hackwerk-build
      context: .
      args:
        VERSION: dev
        COMMIT: local
        BUILD_TIME: local
    command: ["migrate", "up"]
    environment:
      APP_ENV: development
      APP_BASE_URL: http://localhost:18533
      APP_LISTEN_ADDR: :18533
      DATABASE_URL: postgres://hackplan_migrate:development-only@postgres:5432/hackplan?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    restart: "no"

  app:
    build: *hackwerk-build
    command: ["serve"]
    environment: &hackwerk-environment
      APP_ENV: development
      APP_BASE_URL: http://localhost:18533
      APP_LISTEN_ADDR: :18533
      DATABASE_URL: postgres://hackplan_app:development-only@postgres:5432/hackplan?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "18533:18533"
    healthcheck:
      test: ["CMD", "/hackwerk", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks: [backend, public]
    restart: unless-stopped

  worker:
    build: *hackwerk-build
    command: ["worker"]
    environment: *hackwerk-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks: [backend, egress]
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  backend:
    internal: true
  public:
  egress:
