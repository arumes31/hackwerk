name: hackwerk

services:
  postgres:
    image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: hackplan_bootstrap
      POSTGRES_PASSWORD: development-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackplan_bootstrap -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./scripts/postgres/init.sql:/docker-entrypoint-initdb.d/10-hackplan.sql:ro
    networks: [backend]

  migrate:
    build: &hackwerk-build
      context: .
      args:
        VERSION: ${HACKWERK_VERSION:-dev}
        RELEASE_VERSION: ${HACKWERK_RELEASE_VERSION:-dev}
        COMMIT: ${HACKWERK_COMMIT:-local}
        BUILD_TIME: ${HACKWERK_BUILD_TIME:-local}
    command: ["migrate", "up"]
    environment:
      APP_ENV: development
      APP_BASE_URL: http://localhost:18533
      APP_LISTEN_ADDR: :18533
      APP_ALLOWED_HOSTS: localhost,127.0.0.1,::1
      APP_TRUSTED_PROXY_CIDRS: ""
      HTTP_MAX_BODY_BYTES: ${HTTP_MAX_BODY_BYTES:-16777216}
      INTERNAL_RATE_LIMIT_PER_MINUTE: ${INTERNAL_RATE_LIMIT_PER_MINUTE:-600}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_LISTEN_ADDR: ${METRICS_LISTEN_ADDR:-127.0.0.1:19090}
      WORKER_HEARTBEAT_STALE_AFTER: ${WORKER_HEARTBEAT_STALE_AFTER:-2m}
      DATABASE_URL: postgres://hackplan_migrate:development-only@postgres:5432/hackplan?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    restart: "no"

  app:
    build: *hackwerk-build
    command: ["serve"]
    environment: &hackwerk-environment
      APP_ENV: development
      APP_BASE_URL: http://localhost:18533
      APP_LISTEN_ADDR: :18533
      APP_ALLOWED_HOSTS: ${APP_ALLOWED_HOSTS:-*}
      DATABASE_URL: postgres://hackplan_app:development-only@postgres:5432/hackplan?sslmode=disable
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      SMS_ENABLED: ${SMS_ENABLED:-false}
      DASHBOARD_HORIZON_DAYS: ${DASHBOARD_HORIZON_DAYS:-14}
      DASHBOARD_PENDING_AFTER: ${DASHBOARD_PENDING_AFTER:-15m}
      DASHBOARD_BUSINESS_OPEN: ${DASHBOARD_BUSINESS_OPEN:-07:00}
      DASHBOARD_BUSINESS_CLOSE: ${DASHBOARD_BUSINESS_CLOSE:-17:00}
      CALENDAR_UID_DOMAIN: ${CALENDAR_UID_DOMAIN:-hackwerk.local}
      CALENDAR_ENABLED: ${CALENDAR_ENABLED:-true}
      CALENDAR_NAME: ${CALENDAR_NAME:-HackWerk Termine}
      CALENDAR_EXPORT_MAX_DAYS: ${CALENDAR_EXPORT_MAX_DAYS:-366}
      CALENDAR_FEED_HISTORY_DAYS: ${CALENDAR_FEED_HISTORY_DAYS:-90}
      CALENDAR_FEED_FUTURE_DAYS: ${CALENDAR_FEED_FUTURE_DAYS:-366}
      CALENDAR_FEED_RATE_LIMIT: ${CALENDAR_FEED_RATE_LIMIT:-120}
      PLANNING_ROUTER: ${PLANNING_ROUTER:-haversine}
      PLANNING_ROUTING_URL: ${PLANNING_ROUTING_URL:-}
      PLANNING_ROUTING_TIMEOUT: ${PLANNING_ROUTING_TIMEOUT:-5s}
      PLANNING_ROUTING_MAX_RESPONSE_BYTES: ${PLANNING_ROUTING_MAX_RESPONSE_BYTES:-1048576}
      PLANNING_ROUTING_BACKOFF: ${PLANNING_ROUTING_BACKOFF:-30s}
      PLANNING_ROUTING_CACHE_TTL: ${PLANNING_ROUTING_CACHE_TTL:-1h}
      PLANNING_ROUTING_CACHE_ENTRIES: ${PLANNING_ROUTING_CACHE_ENTRIES:-512}
      PLANNING_HORIZON_DAYS: ${PLANNING_HORIZON_DAYS:-56}
      PLANNING_SLOT_MINUTES: ${PLANNING_SLOT_MINUTES:-15}
      PLANNING_BUFFER_MINUTES: ${PLANNING_BUFFER_MINUTES:-15}
      PLANNING_CANDIDATE_LIMIT: ${PLANNING_CANDIDATE_LIMIT:-2500}
      PLANNING_SUGGESTION_TTL: ${PLANNING_SUGGESTION_TTL:-30m}
      PLANNING_BUSINESS_OPEN: ${PLANNING_BUSINESS_OPEN:-07:00}
      PLANNING_BUSINESS_CLOSE: ${PLANNING_BUSINESS_CLOSE:-17:00}
      PLANNING_HAVERSINE_ROAD_FACTOR: ${PLANNING_HAVERSINE_ROAD_FACTOR:-1.3}
      PLANNING_HAVERSINE_SPEED_KMH: ${PLANNING_HAVERSINE_SPEED_KMH:-55}
      PLANNING_WEIGHT_PREFERENCE: ${PLANNING_WEIGHT_PREFERENCE:-25}
      PLANNING_WEIGHT_TRAVEL: ${PLANNING_WEIGHT_TRAVEL:-25}
      PLANNING_WEIGHT_DRIVER: ${PLANNING_WEIGHT_DRIVER:-15}
      PLANNING_WEIGHT_RESOURCE: ${PLANNING_WEIGHT_RESOURCE:-10}
      PLANNING_WEIGHT_UTILIZATION: ${PLANNING_WEIGHT_UTILIZATION:-10}
      PLANNING_WEIGHT_URGENCY: ${PLANNING_WEIGHT_URGENCY:-10}
      PLANNING_WEIGHT_REGION: ${PLANNING_WEIGHT_REGION:-5}
      MAP_TILE_URL: ${MAP_TILE_URL:-}
      MAP_TILE_TOKEN: ${MAP_TILE_TOKEN:-}
      MAP_TILE_TOKEN_FILE: ${MAP_TILE_TOKEN_FILE:-}
      MAP_TILE_ATTRIBUTION: ${MAP_TILE_ATTRIBUTION:-© OpenStreetMap-Mitwirkende}
      MAP_TILE_TIMEOUT: ${MAP_TILE_TIMEOUT:-8s}
      MAP_TILE_MAX_RESPONSE_BYTES: ${MAP_TILE_MAX_RESPONSE_BYTES:-2097152}
      MAP_TILE_MAX_ZOOM: ${MAP_TILE_MAX_ZOOM:-19}
      GEOCODING_ENABLED: ${GEOCODING_ENABLED:-false}
      GEOCODING_SEARCH_URL: ${GEOCODING_SEARCH_URL:-}
      GEOCODING_COUNTRY_CODES: ${GEOCODING_COUNTRY_CODES:-at}
      GEOCODING_TIMEOUT: ${GEOCODING_TIMEOUT:-5s}
      GEOCODING_MAX_RESPONSE_BYTES: ${GEOCODING_MAX_RESPONSE_BYTES:-262144}
      GEOCODING_MAX_RESULTS: ${GEOCODING_MAX_RESULTS:-5}
      GEOCODING_RATE_LIMIT_PER_MINUTE: ${GEOCODING_RATE_LIMIT_PER_MINUTE:-30}
      GEOCODING_MIN_INTERVAL: ${GEOCODING_MIN_INTERVAL:-1s}
      GEOCODING_CACHE_TTL: ${GEOCODING_CACHE_TTL:-24h}
      GEOCODING_CACHE_ENTRIES: ${GEOCODING_CACHE_ENTRIES:-512}
      VOICE_ENABLED: ${VOICE_ENABLED:-false}
      VOICE_TRANSCRIBER: ${VOICE_TRANSCRIBER:-disabled}
      VOICE_EXTRACTOR: ${VOICE_EXTRACTOR:-rules}
      VOICE_OPENAI_API_KEY: ${VOICE_OPENAI_API_KEY:-}
      VOICE_OPENAI_MODEL: ${VOICE_OPENAI_MODEL:-gpt-4o-mini-transcribe}
      VOICE_OPENAI_EXTRACTION_MODEL: ${VOICE_OPENAI_EXTRACTION_MODEL:-gpt-5-mini}
      VOICE_FAKE_TRANSCRIPT: ${VOICE_FAKE_TRANSCRIPT:-}
      VOICE_MAX_DURATION: ${VOICE_MAX_DURATION:-90s}
      VOICE_MAX_BYTES: ${VOICE_MAX_BYTES:-15728640}
      VOICE_DRAFT_RETENTION: ${VOICE_DRAFT_RETENTION:-24h}
      VOICE_PROVIDER_TIMEOUT: ${VOICE_PROVIDER_TIMEOUT:-30s}
      VOICE_MAX_RESPONSE_BYTES: ${VOICE_MAX_RESPONSE_BYTES:-1048576}
      VOICE_TEMP_DIR: ${VOICE_TEMP_DIR:-/tmp/hackwerk-voice}
      VOICE_RATE_LIMIT_PER_MINUTE: ${VOICE_RATE_LIMIT_PER_MINUTE:-10}
      VOICE_CONCURRENT_PER_USER: ${VOICE_CONCURRENT_PER_USER:-2}
      VOICE_EXTERNAL_PROVIDER_NOTICE: ${VOICE_EXTERNAL_PROVIDER_NOTICE:-Bei aktivem externem Sprachdienst verlassen Audio und/oder Transkript zur Verarbeitung die HackWerk-Infrastruktur.}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "18533:18533"
    healthcheck:
      test: ["CMD", "/hackwerk", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks: [backend, public, routing]
    restart: unless-stopped

  worker:
    build: *hackwerk-build
    command: ["worker"]
    environment:
      <<: *hackwerk-environment
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-587}
      MAIL_SMTP_TLS: ${MAIL_SMTP_TLS:-starttls}
      MAIL_SMTP_USERNAME: ${MAIL_SMTP_USERNAME:-}
      MAIL_SMTP_USERNAME_FILE: ${MAIL_SMTP_USERNAME_FILE:-}
      MAIL_SMTP_PASSWORD: ${MAIL_SMTP_PASSWORD:-}
      MAIL_SMTP_PASSWORD_FILE: ${MAIL_SMTP_PASSWORD_FILE:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-HackWerk}
      MAIL_CONNECT_TIMEOUT: ${MAIL_CONNECT_TIMEOUT:-8s}
      MAIL_COMMAND_TIMEOUT: ${MAIL_COMMAND_TIMEOUT:-12s}
      MAIL_MAX_ATTEMPTS: ${MAIL_MAX_ATTEMPTS:-6}
      SMS_PROVIDER: ${SMS_PROVIDER:-sendberry}
      SENDBERRY_API_URL: ${SENDBERRY_API_URL:-}
      SENDBERRY_API_KEY: ${SENDBERRY_API_KEY:-}
      SENDBERRY_API_KEY_FILE: ${SENDBERRY_API_KEY_FILE:-}
      SENDBERRY_ACCESS_NAME: ${SENDBERRY_ACCESS_NAME:-}
      SENDBERRY_ACCESS_NAME_FILE: ${SENDBERRY_ACCESS_NAME_FILE:-}
      SENDBERRY_ACCESS_PASSWORD: ${SENDBERRY_ACCESS_PASSWORD:-}
      SENDBERRY_ACCESS_PASSWORD_FILE: ${SENDBERRY_ACCESS_PASSWORD_FILE:-}
      SMS_SENDER: ${SMS_SENDER:-}
      SMS_TIMEOUT: ${SMS_TIMEOUT:-8s}
      SMS_MAX_ATTEMPTS: ${SMS_MAX_ATTEMPTS:-6}
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks: [backend, egress]
    healthcheck:
      test: ["CMD", "/hackwerk", "healthcheck", "worker"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s
    restart: unless-stopped

  osrm:
    build:
      context: .
      dockerfile: scripts/ops/osrm-tools.Dockerfile
    image: ${OSRM_IMAGE:-hackwerk-osrm-tools:v26.7.3-1}
    command: ["osrm-routed", "--threads", "2", "--algorithm", "mld", "--mmap", "--max-table-size", "25", "/data/current/route.osrm"]
    volumes:
      - ${OSRM_DATA_DIR:-./.tmp/osrm-data}:/data:ro
    networks: [routing]
    read_only: true
    user: "65532:65532"
    tmpfs:
      - /tmp:size=32m,mode=1777,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 128
    cpus: "1.50"
    mem_limit: 2g
    memswap_limit: 3g
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --max-time 5 'http://127.0.0.1:5000/route/v1/driving/14.2858,48.3069;14.3000,48.3100?overview=false' | grep -q '\"code\":\"Ok\"'"]
      interval: 15s
      timeout: 6s
      retries: 8
      start_period: 30s
    profiles: [routing]
    restart: unless-stopped

  osrm-update:
    build:
      context: .
      dockerfile: scripts/ops/osrm-tools.Dockerfile
    image: ${OSRM_IMAGE:-hackwerk-osrm-tools:v26.7.3-1}
    command: ["ionice", "-c", "3", "nice", "-n", "15", "/usr/local/bin/hackwerk-osrm-update"]
    environment:
      OSRM_DATA_ROOT: /data
      OSRM_BBOX: ${OSRM_BBOX:-9.4,46.3,17.5,49.5}
      OSRM_MIN_FREE_KB: ${OSRM_MIN_FREE_KB:-20971520}
      OSRM_THREADS: ${OSRM_THREADS:-2}
      OSRM_DOWNLOAD_LIMIT: ${OSRM_DOWNLOAD_LIMIT:-4M}
    volumes:
      - ${OSRM_DATA_DIR:-./.tmp/osrm-data}:/data
    networks: [egress]
    read_only: true
    user: "65532:65532"
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 512
    cpus: "2.00"
    mem_limit: 4g
    memswap_limit: 6g
    blkio_config:
      weight: 100
    profiles: [osrm-ops]
    restart: "no"

volumes:
  postgres-data:

networks:
  backend:
    internal: true
  public:
  egress:
  routing:
    internal: true
