openapi: 3.1.0
info:
  title: HackWerk HTTP API
  version: 0.10.0
  description: Interner Vertrag des serverseitig gerenderten HackWerk-Webdienstes.
servers:
  - url: http://localhost:18533
paths:
  /api/v1/voice/drafts:
    post:
      operationId: createVoiceDraft
      description: Validiert und verarbeitet eine begrenzte Audiodatei zu einem eigentümergebundenen, ablaufenden Review-Entwurf. Legt weder Kunde, Auftrag, Wartelisteneintrag noch Termin an.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [audio, duration_ms]
              properties:
                audio: { type: string, format: binary, description: WebM, Ogg, WAV oder MP4; serverseitig auf Container und Größe geprüft. }
                duration_ms: { type: integer, minimum: 1, maximum: 90000 }
      responses:
        "201":
          description: Review-Entwurf oder sicher fehlgeschlagener Entwurf erzeugt; Audio wurde nach dem Versuch gelöscht.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoiceDraftCreated" }
        "403": { description: Session, Rolle oder CSRF ungültig. }
        "413": { description: Upload überschreitet das konfigurierte Limit. }
        "415": { description: Container oder MIME-Typ wird nicht unterstützt. }
        "422": { description: Datei ist leer oder die angegebene Dauer ungültig. }
        "429": { description: Benutzerbezogenes Rate- oder Parallelitätslimit erreicht. }
        "503": { description: Spracheingabe administrativ deaktiviert. }
  /api/v1/planning/suggestions:
    post:
      operationId: createPlanningSuggestions
      description: Erzeugt bis zu drei unverbindliche, konfliktgeprüfte Kandidaten; erzeugt keinen Termin und keine Benachrichtigung.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [job_id, csrf_token]
              properties:
                job_id: { type: string, format: uuid }
                csrf_token: { type: string }
      responses:
        "201": { description: Persistierter Planning Run mit höchstens drei erklärten Kandidaten. }
        "403": { description: Nur Administratoren dürfen Vorschläge berechnen. }
        "409": { description: Job- oder Wartelistenversion hat sich geändert. }
        "422": { description: Kein valider Slot oder ungültiger Auftrag. }
  /api/v1/planning/suggestions/{suggestionID}/adopt:
    post:
      operationId: adoptPlanningSuggestion
      description: Revalidiert Version, Ablauf, Availability und Reservations-Constraints atomar und erzeugt ausschließlich ein Proposal.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: suggestionID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "201": { description: Proposal erzeugt; keine Fixierung und keine Benachrichtigung. }
        "403": { description: Nur Administratoren dürfen Vorschläge übernehmen. }
        "409": { description: Vorschlag abgelaufen oder Daten/Slot zwischenzeitlich verändert. }
        "404": { description: Vorschlag nicht gefunden. }
  /planning/routes:
    get:
      operationId: getRoutePlanner
      description: Zeigt Administratoren alle offenen, noch nicht aktiv verplanten Aufträge mit explizitem Haufenstandort auf einer Karte.
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: Serverseitig gerenderte Auftragskarte mit Fahrer- und Ressourcenauswahl. }
        "403": { description: Nur Administratoren dürfen Routen planen. }
    post:
      operationId: createRouteDraft
      description: Optimiert ausgewählte Haufenstandorte und speichert einen unverbindlichen Routenentwurf; erzeugt keine Termine oder Nachrichten.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [job_id, driver_id, chipper_resource_id, departure_date, departure_time, csrf_token]
              properties:
                job_id: { type: array, minItems: 1, maxItems: 23, items: { type: string, format: uuid } }
                fixed_job_id: { type: array, maxItems: 23, items: { type: string, format: uuid }, description: Ausgewählte Stopps, deren relative Position bei Optimierung fixiert bleibt. }
                driver_id: { type: string, format: uuid }
                chipper_resource_id: { type: string, format: uuid }
                transport_resource_id: { type: string, format: uuid }
                departure_date: { type: string, format: date, description: Lokales Datum in Europe/Vienna. }
                departure_time: { type: string, pattern: "^[0-2][0-9]:[0-5][0-9]$", description: Lokale Uhrzeit in Europe/Vienna. }
                optimize: { type: boolean, default: true }
                end_at_last_stop: { type: boolean, default: false, description: Route endet am letzten Stopp statt wieder am Depot. }
                csrf_token: { type: string }
      responses:
        "303": { description: Routenentwurf berechnet. }
        "403": { description: Nur Administratoren dürfen Routen planen. }
        "409": { description: Auftrags- oder Wartelistendaten wurden parallel verändert. }
        "422": { description: Auswahl, Standort oder Routingdaten ungültig. }
  /planning/routes/{routeID}/assign:
    post:
      operationId: assignRouteDraft
      description: Revalidiert die vollständige Route atomar und erzeugt je Stopp ausschließlich ein Proposal; keine Fixierung und kein Versand.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: routeID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "303": { description: Route als unverbindliche Terminvorschläge zugewiesen. }
        "403": { description: Nur Administratoren dürfen Routen zuweisen. }
        "409": { description: Route, Auftrag, Warteliste, Fahrer oder Ressource hat sich verändert beziehungsweise überschneidet sich. }
  /planning/routes/{routeID}/move-stop:
    post:
      operationId: moveDraftRouteStop
      description: Verschiebt einen Stopp atomisch zwischen zwei Routenentwürfen, prüft beide Versionen und berechnet beide Strecken neu. Erzeugt keine Termine.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: routeID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "303": { description: Beide Entwürfe wurden aktualisiert. }
        "403": { description: Nur Administratoren dürfen Routenentwürfe ändern. }
        "409": { description: Mindestens eine Routenversion oder ein Stopp wurde parallel geändert. }
  /my-route:
    get:
      operationId: getOwnRoute
      description: Zeigt einem Fahrer ausschließlich die eigene zugewiesene Route eines lokalen Arbeitstags.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: date, in: query, required: false, schema: { type: string, format: date } }
      responses:
        "200": { description: Eigene Route oder leerer Zustand. }
        "403": { description: Kein zugeordnetes Fahrerprofil. }
  /my-route/{routeID}/reorder:
    post:
      operationId: reorderOwnRoute
      description: Ändert ausschließlich die Stoppfolge der eigenen zugewiesenen Route. Auftragsmenge, Zugehörigkeit, Fahrer, Ressourcen und Terminzeiten bleiben unverändert.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: routeID, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [stop_id, version, csrf_token]
              properties:
                stop_id: { type: array, minItems: 1, maxItems: 23, items: { type: string, format: uuid } }
                version: { type: integer, minimum: 1 }
                csrf_token: { type: string }
      responses:
        "303": { description: Fahrreihenfolge gespeichert und Strecke neu berechnet. }
        "403": { description: Route gehört nicht zum angemeldeten Fahrer. }
        "409": { description: Routenversion wurde parallel geändert. }
        "422": { description: Stoppmenge ist keine exakte Permutation der Route. }
  /calendar/export.ics:
    get:
      operationId: exportCalendarICS
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: detail, in: query, required: false, schema: { type: string, enum: [internal, minimal] } }
      responses:
        "200": { description: Begrenzter read-only iCalendar-Download. }
        "422": { description: Datumsbereich ungültig oder zu groß. }
  /api/v1/calendar-feeds:
    get:
      operationId: listCalendarFeeds
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: Eigene Feeds ohne Roh-Token. }
    post:
      operationId: createCalendarFeed
      description: Erzeugt einen privaten Rohlink, der ausschließlich in dieser Antwort vollständig erscheint.
      security: [{ sessionCookie: [] }]
      responses:
        "201": { description: Feed und einmalig sichtbare URL erzeugt. }
        "422": { description: Filter ungültig. }
  /api/v1/calendar-feeds/{calendarFeedID}/rotate:
    post:
      operationId: rotateCalendarFeed
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: calendarFeedID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Alter Token atomar ersetzt; neue URL einmal sichtbar. }
        "409": { description: Version veraltet. }
  /api/v1/calendar-feeds/{calendarFeedID}:
    delete:
      operationId: revokeCalendarFeed
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: calendarFeedID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Feed widerrufen. }
        "409": { description: Version veraltet. }
  /feeds/{calendarFeedToken}/calendar.ics:
    get:
      operationId: getPrivateCalendarFeed
      description: Öffentlicher read-only Capability-Abruf ohne Sessioncookie; Token wird nur gehasht gespeichert und in Logs redigiert.
      parameters:
        - { name: calendarFeedToken, in: path, required: true, schema: { type: string, minLength: 40, maxLength: 100 } }
      responses:
        "200": { description: Gefilterter iCalendar-Feed mit ETag und Last-Modified. }
        "304": { description: Inhalt gemäß ETag unverändert. }
        "404": { description: Einheitlich für ungültig, widerrufen, abgelaufen oder Owner deaktiviert. }
        "429": { description: Kalenderclient-tolerantes Abruflimit erreicht. }
  /dashboard:
    get:
      operationId: getDashboard
      description: Rollenprojizierter, read-only Tagesüberblick mit begrenztem Folge-Horizont.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: date
          in: query
          required: false
          description: Lokaler Tag in Europe/Vienna; ohne Wert wird heute verwendet.
          schema: { type: string, format: date }
      responses:
        "200": { description: Serverseitig gerendertes Dashboard für Admin oder Fahrer. }
        "401": { description: Anmeldung erforderlich. }
        "422": { description: Datum ungültig oder außerhalb der begrenzten Auswahl. }
        "500": { description: Recoverable Fehlerzustand ohne interne Datenbankdetails. }
  /login:
    get:
      operationId: getLogin
      responses:
        "200": { description: Deutsches Anmeldeformular. }
    post:
      operationId: postLogin
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password, writeOnly: true }
      responses:
        "303": { description: Anmeldung erfolgreich; opaque Session wurde rotiert. }
        "401": { description: Generische ungültige Zugangsdaten. }
        "429": { description: Loginlimit erreicht, mit derselben generischen sichtbaren Meldung. }
  /logout:
    post:
      operationId: postLogout
      security: [{ sessionCookie: [] }]
      responses:
        "303": { description: Session serverseitig widerrufen. }
        "403": { description: CSRF-Prüfung fehlgeschlagen. }
  /password:
    get:
      operationId: getPasswordChange
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: Passwortänderungsformular. }
    post:
      operationId: postPasswordChange
      security: [{ sessionCookie: [] }]
      responses:
        "303": { description: Passwort geändert und bestehende Sessions widerrufen. }
        "403": { description: CSRF-Prüfung fehlgeschlagen. }
        "422": { description: Passwortpolicy oder Bestätigung ungültig. }
  /admin/users:
    get:
      operationId: listUsers
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: Adminliste der Benutzer und Fahrerzuordnung. }
        "403": { description: Adminberechtigung fehlt. }
    post:
      operationId: createUser
      security: [{ sessionCookie: [] }]
      responses:
        "303": { description: Benutzer atomar angelegt und auditiert. }
        "403": { description: Adminberechtigung oder CSRF fehlt. }
  /admin/users/{userID}/details:
    parameters:
      - name: userID
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: updateUserDetails
      description: Ändert ausschließlich Benutzername, Anzeigename und E-Mail des Zugangs; ein verknüpftes Fahrerprofil bleibt unverändert.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [csrf_token, version, username, display_name]
              properties:
                csrf_token: { type: string, writeOnly: true }
                version: { type: integer, minimum: 1 }
                username: { type: string, minLength: 1, maxLength: 200 }
                display_name: { type: string, minLength: 1, maxLength: 200 }
                email: { type: string, format: email, maxLength: 320 }
      responses:
        "303": { description: Benutzer-Stammdaten versioniert gespeichert und minimiert auditiert. }
        "403": { description: Adminberechtigung oder CSRF fehlt. }
        "409": { description: Version veraltet oder Benutzername bereits vergeben. }
        "422": { description: Benutzername, Anzeigename oder E-Mail ungültig. }
  /customers:
    get:
      operationId: listCustomers
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: Serverseitig paginierte aktive Kundenliste ohne Kontaktwerte in der URL. }
        "401": { description: Anmeldung erforderlich. }
    post:
      operationId: createCustomerIntake
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: "#/components/schemas/CustomerIntakeForm" }
      responses:
        "303": { description: Kunde, Auftrag und Wartelisteneintrag atomar angelegt; Redirect zur Kundenakte. }
        "403": { description: Berechtigung oder CSRF fehlt. }
        "422": { description: Kontakt-, Mengen-, Dauer-, Zeitraum- oder Transportvalidierung fehlgeschlagen. }
  /customers/search:
    post:
      operationId: searchCustomers
      description: POST verhindert, dass Telefonnummern oder E-Mail-Adressen in URL, Browserhistorie oder Access Logs gelangen.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [csrf_token]
              properties:
                csrf_token: { type: string, writeOnly: true }
                q: { type: string, maxLength: 320 }
                page: { type: integer, minimum: 1, default: 1 }
      responses:
        "200": { description: Suchergebnis nach Name, Firma, Ort, Telefon oder Auftragsnummer. }
        "403": { description: Berechtigung oder CSRF fehlt. }
  /customers/{customerID}:
    parameters:
      - $ref: "#/components/parameters/CustomerID"
    get:
      operationId: getCustomer
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: Kundenakte mit getrennten Aufträgen, append-only Notizen und sicherem Maps-Link. }
        "404": { description: Kundenakte nicht gefunden. }
    post:
      operationId: updateCustomer
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: "#/components/schemas/CustomerUpdateForm" }
      responses:
        "303": { description: Kundendaten aktualisiert. }
        "403": { description: Berechtigung oder CSRF fehlt. }
        "409": { description: Erwartete Version ist veraltet. }
        "422": { description: Eingabe fachlich ungültig. }
  /customers/{customerID}/archive:
    parameters:
      - $ref: "#/components/parameters/CustomerID"
    post:
      operationId: archiveCustomer
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: "#/components/schemas/VersionForm" }
      responses:
        "303": { description: Kunde archiviert; Historie bleibt erhalten. }
        "403": { description: Adminberechtigung oder CSRF fehlt. }
        "409": { description: Erwartete Version ist veraltet. }
  /customers/{customerID}/jobs:
    parameters:
      - $ref: "#/components/parameters/CustomerID"
    post:
      operationId: createCustomerJob
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: "#/components/schemas/JobForm" }
      responses:
        "303": { description: Separater Auftrag und Wartelisteneintrag für bestehenden aktiven Kunden angelegt. }
        "403": { description: Berechtigung oder CSRF fehlt. }
        "404": { description: Aktiver Kunde nicht gefunden. }
        "422": { description: Auftrag fachlich ungültig. }
  /jobs/{jobID}:
    parameters:
      - $ref: "#/components/parameters/JobID"
    post:
      operationId: updateJob
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              allOf:
                - $ref: "#/components/schemas/JobForm"
                - $ref: "#/components/schemas/VersionForm"
      responses:
        "303": { description: Auftrag aktualisiert. }
        "403": { description: Berechtigung oder CSRF fehlt. }
        "409": { description: Erwartete Version ist veraltet oder Auftrag nicht mehr bearbeitbar. }
        "422": { description: Auftrag fachlich ungültig. }
  /jobs/{jobID}/archive:
    parameters:
      - $ref: "#/components/parameters/JobID"
    post:
      operationId: archiveJob
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: "#/components/schemas/VersionForm" }
      responses:
        "303": { description: Auftrag archiviert und aktiver Wartelisteneintrag atomar entfernt. }
        "403": { description: Adminberechtigung oder CSRF fehlt. }
        "409": { description: Erwartete Version ist veraltet oder Auftrag nicht archivierungsfähig. }
  /jobs/{jobID}/notes:
    parameters:
      - $ref: "#/components/parameters/JobID"
    post:
      operationId: appendJobNote
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [csrf_token, body]
              properties:
                csrf_token: { type: string, writeOnly: true }
                body: { type: string, minLength: 1, maxLength: 4000 }
                customer_id: { type: string, format: uuid }
      responses:
        "303": { description: Neue unveränderliche Notiz mit Autor und Zeitstempel angehängt. }
        "403": { description: Berechtigung oder CSRF fehlt. }
        "422": { description: Notiz leer oder zu lang. }
  /jobs/{jobID}/duplicate:
    parameters:
      - $ref: "#/components/parameters/JobID"
    get:
      operationId: duplicateJobDraftForm
      description: Öffnet einen vorbefüllten, prüfbaren neuen Auftragsentwurf. Status, Termine und Notizen werden nicht kopiert.
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: Neuanlageformular mit fachlichen Feldern des Quellauftrags. }
        "404": { description: Quellauftrag nicht gefunden. }
  /recent/customers/{customerID}:
    parameters: [{ $ref: "#/components/parameters/CustomerID" }]
    post:
      operationId: recordRecentCustomer
      description: Aktualisiert den begrenzten benutzerbezogenen Verlauf ohne Browser-Storage.
      security: [{ sessionCookie: [] }]
      responses:
        "303": { description: Verlauf idempotent aktualisiert und zur Kundenakte weitergeleitet. }
        "403": { description: Berechtigung oder CSRF fehlt. }
  /recent/jobs/{jobID}:
    parameters: [{ $ref: "#/components/parameters/JobID" }]
    post:
      operationId: recordRecentJob
      description: Aktualisiert den begrenzten benutzerbezogenen Verlauf ohne Browser-Storage.
      security: [{ sessionCookie: [] }]
      responses:
        "303": { description: Verlauf idempotent aktualisiert und zum Auftrag weitergeleitet. }
        "403": { description: Berechtigung oder CSRF fehlt. }
  /waitlist:
    get:
      operationId: listWaitlist
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { type: string, enum: [chipping_only, chipping_with_transport] } }
        - { name: region, in: query, schema: { type: string } }
        - { name: urgency, in: query, schema: { type: string, enum: [low, normal, high, urgent] } }
        - { name: month, in: query, schema: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$" } }
        - { name: sort, in: query, schema: { type: string, enum: [entered, preferred, urgency, volume, region], default: entered } }
        - { name: direction, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        "200": { description: Responsive, stabil paginierte und serverseitig sortierte/gefilterte Warteliste. }
        "401": { description: Anmeldung erforderlich. }
  /waitlist/{waitlistID}/priority:
    parameters:
      - $ref: "#/components/parameters/WaitlistID"
    post:
      operationId: updateWaitlistPriority
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [csrf_token, version, priority]
              properties:
                csrf_token: { type: string, writeOnly: true }
                version: { type: integer, minimum: 1 }
                priority: { type: integer, minimum: -100, maximum: 100 }
      responses:
        "303": { description: Adminpriorität aktualisiert und auditiert. }
        "403": { description: Adminberechtigung oder CSRF fehlt. }
        "409": { description: Erwartete Version ist veraltet. }
  /waitlist/{waitlistID}/remove:
    parameters:
      - $ref: "#/components/parameters/WaitlistID"
    post:
      operationId: removeWaitlistEntry
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [csrf_token, version, reason]
              properties:
                csrf_token: { type: string, writeOnly: true }
                version: { type: integer, minimum: 1 }
                reason: { type: string, enum: [scheduled, cancelled, duplicate, other] }
      responses:
        "303": { description: Wartelisteneintrag historisch entfernt und auditiert. }
        "403": { description: Adminberechtigung oder CSRF fehlt. }
        "409": { description: Erwartete Version ist veraltet. }
  /waitlist/filter-favorites:
    post:
      operationId: saveWaitlistFilterFavorite
      description: Speichert ausschließlich allowlistete, nicht-personenbezogene Filterdimensionen benutzerbezogen.
      security: [{ sessionCookie: [] }]
      responses:
        "303": { description: Filterfavorit gespeichert. }
        "403": { description: Berechtigung oder CSRF fehlt. }
        "422": { description: Name oder Filterdimension ungültig. }
  /waitlist/filter-favorites/{favoriteID}/delete:
    parameters:
      - { name: favoriteID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: deleteWaitlistFilterFavorite
      security: [{ sessionCookie: [] }]
      responses:
        "303": { description: Eigener Filterfavorit gelöscht. }
        "403": { description: Berechtigung oder CSRF fehlt. }
  /availability:
    get:
      operationId: getOwnAvailability
      description: Mobile HTML-Verwaltung der eigenen Wochenregeln und Ausnahmen; das Zielprofil stammt ausschließlich aus der Session.
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: Wochenplan, Ausnahmen und normalisierte 14-Tage-Vorschau in Europe/Vienna. }
        "403": { description: Kein zugeordnetes eigenes Fahrerprofil. }
  /availability/rules/{ruleID}/duplicate:
    parameters:
      - { name: ruleID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: duplicateOwnAvailabilityRule
      security: [{ sessionCookie: [] }]
      responses:
        "303": { description: Eigene Wochenregel auf den gewählten Wochentag dupliziert. }
        "403": { description: Fremdes Fahrerprofil oder CSRF ungültig. }
        "409": { description: Überlappende Regel. }
  /availability/rules/clear-day:
    post:
      operationId: clearOwnAvailabilityDay
      description: Löscht die mit Versionen bestätigte Menge eigener Regeln für einen Wochentag atomar.
      security: [{ sessionCookie: [] }]
      responses:
        "303": { description: Regeln atomar gelöscht. }
        "409": { description: Regelmenge oder Version wurde parallel geändert. }
  /availability/exceptions/vacation-preset:
    post:
      operationId: createOwnVacationPreset
      description: Erzeugt Abwesenheitsausnahmen für einen Tag oder eine Arbeitswoche in Europe/Vienna.
      security: [{ sessionCookie: [] }]
      responses:
        "303": { description: Urlaubsausnahmen gespeichert. }
        "422": { description: Datum oder Ortszeit ungültig. }
  /admin/drivers:
    get:
      operationId: listDriverProfiles
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: Fahrerprofile mit gemeinsamer Verfügbarkeitsübersicht der nächsten sieben Tage. }
        "403": { description: Adminberechtigung fehlt. }
    post:
      operationId: createDriverProfile
      security: [{ sessionCookie: [] }]
      responses:
        "303": { description: Eigenständiges, optional mit einem Login verknüpftes Fahrerprofil angelegt. }
        "403": { description: Adminberechtigung oder CSRF fehlt. }
        "422": { description: Profil oder Loginzuordnung ungültig. }
  /admin/resources:
    get:
      operationId: listResources
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: Generische Maschinen- und Transportressourcen. }
        "403": { description: Adminberechtigung fehlt. }
    post:
      operationId: createResource
      security: [{ sessionCookie: [] }]
      responses:
        "303": { description: Ressource mit typisierten Kapazitätsdaten angelegt. }
        "403": { description: Adminberechtigung oder CSRF fehlt. }
        "422": { description: Typ, Name oder Kapazität ungültig. }
  /api/v1/me/availability:
    get:
      operationId: resolveOwnAvailability
      description: Liefert UTC-Intervalle für das Fahrerprofil der Session. Interne Notizen werden nie in das Overlay serialisiert.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/AvailabilityFrom"
        - $ref: "#/components/parameters/AvailabilityTo"
      responses:
        "200":
          description: Normalisierte Intervalle samt minimaler Provenienz.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AvailabilityResponse" }
        "403": { description: Eigenes Fahrerprofil fehlt. }
        "422": { description: Zeitraum ungültig oder länger als 90 Tage. }
  /api/v1/drivers/{driverID}/availability:
    parameters:
      - $ref: "#/components/parameters/DriverID"
    get:
      operationId: resolveDriverAvailability
      description: Admin-Overlay eines Fahrerprofils; Fahrer können diesen Fremdpfad nicht verwenden.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/AvailabilityFrom"
        - $ref: "#/components/parameters/AvailabilityTo"
      responses:
        "200":
          description: Normalisierte Intervalle samt minimaler Provenienz.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AvailabilityResponse" }
        "403": { description: Adminberechtigung fehlt. }
        "422": { description: Zeitraum ungültig oder länger als 90 Tage. }
  /calendar:
    get:
      operationId: getCalendarPage
      description: Responsive Tages-/Wochen-/Agendaansicht; Fahrer sehen alle Termine read-only, Admins zusätzlich Warteliste und Einplanungsdialog.
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: Serverseitig gerenderte Kalenderseite mit lokal gebündeltem FullCalendar Standard. }
        "403": { description: Kalenderberechtigung fehlt. }
  /api/v1/calendar:
    get:
      operationId: listCalendarEvents
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/CalendarFrom"
        - $ref: "#/components/parameters/CalendarTo"
      responses:
        "200":
          description: Begrenzte FullCalendar-Events ohne Telefon/E-Mail.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CalendarEvent" }
        "403": { description: Kalenderberechtigung fehlt. }
        "422": { description: Zeitraum ungültig oder länger als 93 Tage. }
  /api/v1/calendar/conflicts:
    get:
      operationId: listCalendarConflicts
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/CalendarFrom"
        - $ref: "#/components/parameters/CalendarTo"
        - { name: driver_id, in: query, schema: { type: array, items: { type: string, format: uuid } } }
        - { name: resource_id, in: query, schema: { type: array, items: { type: string, format: uuid } } }
        - { name: exclude_appointment_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Datensparsame aktive Fahrer-/Ressourcenüberschneidungen. }
        "422": { description: Zeitraum oder ID ungültig. }
  /api/v1/calendar/plan:
    post:
      operationId: planWaitlistProposal
      description: Erzeugt Draft, geprüfte Zuweisungen und Proposal; fixiert nie und versendet nichts.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: "#/components/schemas/PlanAppointmentForm" }
      responses:
        "201": { description: Proposal gespeichert. }
        "403": { description: Adminberechtigung oder CSRF fehlt. }
        "409": { description: Version oder exklusive Reservierung kollidiert. }
        "422": { description: Zeit, Verfügbarkeit, Transport oder Zuweisung ungültig. }
  /api/v1/appointments/{appointmentID}:
    parameters: [{ $ref: "#/components/parameters/AppointmentID" }]
    get:
      operationId: getAppointmentDetail
      description: Berechtigte Termindetailansicht. Kontaktdaten und tatsächlich konfigurierbare Versandkanäle werden bewusst nur hier geliefert, nie im Kalenderfeed.
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Termindetail mit Kontakt- und Versandvorschau.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppointmentDetail" }
        "403": { description: Kalenderberechtigung fehlt. }
        "404": { description: Termin nicht gefunden. }
  /api/v1/appointments/{appointmentID}/move:
    parameters: [{ $ref: "#/components/parameters/AppointmentID" }]
    post:
      operationId: moveAppointment
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: "#/components/schemas/AppointmentTimeMutation" }
      responses:
        "200": { description: Zeit und neue Version gespeichert; fixierte Bestätigung wieder pending. }
        "403": { description: Nur Administratoren dürfen verschieben. }
        "409": { description: Stale Version oder physische Überschneidung; Browser muss revertieren. }
        "422": { description: Zeit oder Verfügbarkeit ungültig. }
  /api/v1/appointments/{appointmentID}/assign:
    parameters: [{ $ref: "#/components/parameters/AppointmentID" }]
    post:
      operationId: assignAppointment
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              allOf:
                - $ref: "#/components/schemas/VersionForm"
                - $ref: "#/components/schemas/AppointmentAssignments"
      responses:
        "200": { description: Aktive Fahrer/Ressourcen typgerecht zugewiesen und Version erhöht. }
        "403": { description: Nur Administratoren dürfen zuweisen. }
        "409": { description: Stale Version oder exklusive Reservierungskollision. }
        "422": { description: Inaktive/falsche Zuweisung, Transport oder Verfügbarkeit ungültig. }
  /api/v1/appointments/{appointmentID}/propose:
    parameters: [{ $ref: "#/components/parameters/AppointmentID" }]
    post:
      operationId: proposeAppointment
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              allOf:
                - $ref: "#/components/schemas/VersionForm"
                - type: object
                  properties: { override_reason: { type: string, maxLength: 1000 } }
      responses:
        "200": { description: Draft als blockierendes Proposal aktiviert. }
        "403": { description: Nur Administratoren dürfen vorschlagen. }
        "409": { description: Stale Version oder exklusive Reservierungskollision. }
        "422": { description: Zuweisung, Transport oder Verfügbarkeit ungültig. }
  /api/v1/appointments/{appointmentID}/resize:
    parameters: [{ $ref: "#/components/parameters/AppointmentID" }]
    post:
      operationId: resizeAppointment
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: "#/components/schemas/AppointmentTimeMutation" }
      responses:
        "200": { description: Dauer und neue Version gespeichert. }
        "403": { description: Nur Administratoren dürfen die Dauer ändern. }
        "409": { description: Stale Version oder physische Überschneidung. }
        "422": { description: Zeit oder Verfügbarkeit ungültig. }
  /api/v1/appointments/{appointmentID}/alternatives:
    parameters: [{ $ref: "#/components/parameters/AppointmentID" }]
    get:
      operationId: getAppointmentConflictAlternatives
      description: Liefert für einen gewünschten Zeitraum konkrete konfliktfreie Alternativen sowie betroffene Fahrer, Ressourcen, Aufträge und Kunden.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: starts_at, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: ends_at, in: query, required: true, schema: { type: string, format: date-time } }
      responses:
        "200": { description: Konflikte und bis zu drei Alternativslots. }
        "403": { description: Nur Administratoren dürfen Konfliktalternativen berechnen. }
        "422": { description: Zeitraum ungültig. }
  /api/v1/appointments/{appointmentID}/swap:
    parameters: [{ $ref: "#/components/parameters/AppointmentID" }]
    post:
      operationId: swapAppointmentWindows
      description: Tauscht die Zeitfenster zweier Entwürfe oder Vorschläge atomisch. Fixierte Termine und automatischer Versand sind ausgeschlossen.
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: Beide Zeitfenster und Versionsstände wurden aktualisiert. }
        "403": { description: Nur Administratoren dürfen Zeitfenster tauschen. }
        "409": { description: Version, Lifecycle oder Reservierung kollidiert. }
  /api/v1/appointments/{appointmentID}/fix:
    parameters: [{ $ref: "#/components/parameters/AppointmentID" }]
    post:
      operationId: fixAppointment
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              allOf:
                - $ref: "#/components/schemas/VersionForm"
                - type: object
                  properties: { without_notification_reason: { type: string, maxLength: 1000 } }
      responses:
        "200": { description: Termin, Auftrag, Bestätigungsanfrage, kanalbezogene Notifications, Warteliste, Reservierungen, Audit und Outboxevents atomar gespeichert; kein HTTP-Versand. }
        "403": { description: Nur Administratoren dürfen fixieren. }
        "409": { description: Stale Version oder Reservierungskonflikt. }
        "422": { description: Fahrer, Hackressource, Transport, Verfügbarkeit oder erreichbarer Versandkanal fehlt; Ausnahme erfordert Grund. }

  /api/v1/appointments/{appointmentID}/confirmation/reissue:
    parameters: [{ $ref: "#/components/parameters/AppointmentID" }]
    post:
      operationId: reissueAppointmentConfirmation
      description: Widerruft den aktiven Link und plant mit neuer Tokenversion atomar neue Nachrichten. Nur Admin, immer mit Begründung.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: "#/components/schemas/ReasonedVersionForm" }
      responses:
        "200": { description: Neue Bestätigungsanfrage und Outboxevents atomar eingereiht. }
        "403": { description: Adminberechtigung oder CSRF fehlt. }
        "409": { description: Terminstand geändert, Termin nicht fixiert oder kein erreichbarer Kanal. }

  /api/v1/appointments/{appointmentID}/confirmation/reset:
    parameters: [{ $ref: "#/components/parameters/AppointmentID" }]
    post:
      operationId: resetAppointmentConfirmation
      description: Setzt eine bestehende Kundenantwort mit Auditgrund auf Antwort offen zurück, ohne einen neuen Token anzulegen.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: "#/components/schemas/ReasonedVersionForm" }
      responses:
        "200": { description: Antwort und Terminstatus atomar zurückgesetzt. }
        "403": { description: Adminberechtigung oder CSRF fehlt. }
        "409": { description: Terminstand geändert oder keine zurücksetzbare aktive Antwort. }

  /admin/notifications:
    get:
      operationId: listFailedNotifications
      description: Adminseite mit fehlgeschlagenen aktiven Versandaufträgen und maskierten Kontaktzielen.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [all, failed, retry_wait] } }
      responses:
        "200": { description: Serverseitig gerenderte Versandfehlerliste. }
        "403": { description: Berechtigung notification.resend fehlt. }

  /admin/notifications/{notificationID}/retry:
    parameters:
      - name: notificationID
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: retryNotification
      security: [{ sessionCookie: [] }]
      responses:
        "303": { description: Fehlgeschlagene Nachricht ohne neuen Token erneut eingereiht. }
        "403": { description: Adminberechtigung oder CSRF fehlt. }
        "409": { description: Nachricht oder Bestätigungslink ist nicht mehr aktiv/retrybar. }

  /admin/notifications/{notificationID}/review:
    parameters:
      - name: notificationID
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: reviewNotification
      description: Markiert einen Versandhinweis als administrativ geprüft, ohne Versandstatus oder Retryplanung zu verändern.
      security: [{ sessionCookie: [] }]
      responses:
        "303": { description: Versandhinweis als geprüft markiert. }
        "403": { description: Adminberechtigung oder CSRF fehlt. }
        "409": { description: Hinweis ist nicht mehr offen oder wurde erneut eingereiht. }

  /admin/notifications/report.csv:
    get:
      operationId: exportNotificationReport
      description: CSV-Bericht mit maskierten Zielen und Formula-Injection-Schutz.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [all, failed, retry_wait] } }
      responses:
        "200": { description: Nicht cachebarer CSV-Download. }
        "403": { description: Adminberechtigung fehlt. }

  /termin/{confirmationToken}:
    parameters: [{ $ref: "#/components/parameters/ConfirmationToken" }]
    get:
      operationId: getPublicConfirmation
      description: Öffentliche minimale Terminansicht ohne Konto, Drittanbieterassets oder Analytics. Antwort ist immer no-store/no-referrer.
      responses:
        "200": { description: Aktiver Termin oder generische ungültige Linkseite ohne Existenzorakel. }

  /termin/{confirmationToken}/antwort:
    parameters: [{ $ref: "#/components/parameters/ConfirmationToken" }]
    post:
      operationId: respondToPublicConfirmation
      description: Idempotente link- und noncegebundene Kundenantwort; Ablehnung storniert den Termin nicht.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: "#/components/schemas/ConfirmationResponseForm" }
          multipart/form-data:
            schema: { $ref: "#/components/schemas/ConfirmationResponseForm" }
      responses:
        "200": { description: Gespeicherte Antwort oder generische ungültige Linkseite ohne Existenzorakel. }
  /api/v1/appointments/{appointmentID}/cancel:
    parameters: [{ $ref: "#/components/parameters/AppointmentID" }]
    post:
      operationId: cancelAppointment
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              allOf:
                - $ref: "#/components/schemas/VersionForm"
                - type: object
                  properties: { reason: { type: string, maxLength: 1000 } }
      responses:
        "200": { description: Termin storniert und Reservierungen atomar freigegeben. }
        "403": { description: Nur Administratoren dürfen absagen. }
        "409": { description: Stale Version. }
        "422": { description: Status oder erforderlicher Grund ungültig. }
  /api/v1/appointments/{appointmentID}/reopen:
    parameters: [{ $ref: "#/components/parameters/AppointmentID" }]
    post:
      operationId: reopenAppointment
      description: Öffnet einen abgesagten Termin nach vollständiger Konflikt- und Verfügbarkeitsprüfung ausschließlich als Proposal. Erzeugt keine Nachricht und kein Outboxevent.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              allOf:
                - $ref: "#/components/schemas/VersionForm"
                - type: object
                  required: [reason]
                  properties:
                    reason: { type: string, minLength: 1, maxLength: 1000 }
                    override_reason: { type: string, maxLength: 1000 }
      responses:
        "200": { description: Cancelled-Termin atomar als Proposal reaktiviert und alte Bestätigungslinks widerrufen. }
        "403": { description: Nur Administratoren dürfen wieder öffnen. }
        "409": { description: Stale Version oder Reservierungskonflikt. }
        "422": { description: Status, Begründung, Zuweisung oder Verfügbarkeit ungültig. }
  /api/v1/appointments/{appointmentID}/complete:
    parameters: [{ $ref: "#/components/parameters/AppointmentID" }]
    post:
      operationId: completeAppointment
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              allOf:
                - $ref: "#/components/schemas/VersionForm"
                - type: object
                  properties: { override_reason: { type: string, maxLength: 1000 } }
      responses:
        "200": { description: Fixierter gestarteter Termin durch Admin oder zugewiesenen berechtigten Fahrer abgeschlossen. }
        "403": { description: Abschlussrecht oder Objektzuweisung fehlt. }
        "409": { description: Stale Version. }
        "422": { description: Status/Zeitpunkt ungültig oder Admin-Override fehlt. }
  /health/live:
    get:
      operationId: getLiveness
      responses:
        "200":
          description: Prozess ist aktiv.
  /health/ready:
    get:
      operationId: getReadiness
      responses:
        "200":
          description: Dienst und Datenbank sind bereit.
        "503":
          description: Datenbank ist nicht erreichbar.
components:
  parameters:
    CustomerID:
      name: customerID
      in: path
      required: true
      schema: { type: string, format: uuid }
    JobID:
      name: jobID
      in: path
      required: true
      schema: { type: string, format: uuid }
    WaitlistID:
      name: waitlistID
      in: path
      required: true
      schema: { type: string, format: uuid }
    DriverID:
      name: driverID
      in: path
      required: true
      schema: { type: string, format: uuid }
    AvailabilityFrom:
      name: from
      in: query
      required: true
      schema: { type: string, format: date-time }
    AvailabilityTo:
      name: to
      in: query
      required: true
      schema: { type: string, format: date-time }
    CalendarFrom:
      name: from
      in: query
      required: true
      schema: { type: string, format: date-time }
    CalendarTo:
      name: to
      in: query
      required: true
      schema: { type: string, format: date-time }
    AppointmentID:
      name: appointmentID
      in: path
      required: true
      schema: { type: string, format: uuid }
    ConfirmationToken:
      name: confirmationToken
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
  schemas:
    VoiceDraftCreated:
      type: object
      additionalProperties: false
      required: [draft_id, status, location]
      properties:
        draft_id: { type: string, format: uuid }
        status: { type: string, enum: [needs_review, failed] }
        location: { type: string, pattern: "^/voice/drafts/[0-9a-f-]+$" }
    CalendarEvent:
      type: object
      additionalProperties: false
      required: [id, title, start, end, editable, className, color, contrastColor, extendedProps]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        editable: { type: boolean, description: Nur für Admin und editierbare Lifecycle-Zustände true. }
        className: { type: string, description: FullCalendar-v7-Klassen für Lifecycle und Bestätigung. }
        color: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
        contrastColor: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
        extendedProps:
          type: object
          description: Auftrag, Ort, m³, Status, Zuweisungen, Version und erlaubte Aktionen; niemals Telefon oder E-Mail.
          additionalProperties: true
    AppointmentDetail:
      type: object
      additionalProperties: false
      required: [id, job_id, customer_id, title, start, end, lifecycle, status_label, locality, volume_m3, drivers, resources, notes, maps_url, phone, email, notification_preference, notification_channels, notification_targets, notification_warning, notification_suggestion, notification_requires_override, notifications, version, can_complete, complete_requires_override, can_fix, can_cancel, can_reopen, can_reschedule, can_swap, can_reissue, can_reset_confirmation]
      properties:
        id: { type: string, format: uuid }
        job_id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        title: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        lifecycle: { type: string, enum: [draft, proposal, fixed, cancelled, completed] }
        status_label: { type: string }
        locality: { type: string }
        volume_m3: { type: string }
        drivers: { type: array, items: { type: object, additionalProperties: true } }
        resources: { type: array, items: { type: object, additionalProperties: true } }
        notes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [AuthorName, Body, CreatedAt]
            properties:
              AuthorName: { type: string }
              Body: { type: string }
              CreatedAt: { type: string, format: date-time }
        maps_url: { type: string, format: uri }
        phone: { type: string }
        email: { type: string }
        notification_preference: { type: string, enum: [email, sms, both, none] }
        notification_channels: { type: array, items: { type: string, enum: [E-Mail, SMS] } }
        notification_targets:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [channel, recipient]
            properties:
              channel: { type: string, enum: [E-Mail, SMS] }
              recipient: { type: string, description: Immer serverseitig maskiert. }
        notification_warning: { type: string }
        notification_suggestion: { type: string }
        notification_requires_override: { type: boolean }
        notifications: { type: array, items: { $ref: "#/components/schemas/NotificationStatus" } }
        version: { type: integer, minimum: 1 }
        can_complete: { type: boolean, description: Der angemeldete Akteur darf diesen fixierten Termin unter den aktuellen Zeit-, Zuweisungs- und Fahrerprofilregeln abschließen. }
        complete_requires_override: { type: boolean, description: Ein Administrator muss den Abschluss vor Terminbeginn begründen. }
        can_fix: { type: boolean }
        can_cancel: { type: boolean }
        can_reopen: { type: boolean }
        can_reschedule: { type: boolean, description: Admin darf den editierbaren Termin per Dialog ohne Drag-and-drop verschieben oder in der Dauer ändern. }
        can_swap: { type: boolean }
        can_reissue: { type: boolean }
        can_reset_confirmation: { type: boolean }
    NotificationStatus:
      type: object
      additionalProperties: false
      required: [id, appointment_id, channel, status, recipient, attempt_count, max_attempts, updated_at]
      properties:
        id: { type: string, format: uuid }
        appointment_id: { type: string, format: uuid }
        channel: { type: string, enum: [email, sms] }
        status: { type: string, enum: [queued, sending, retry_wait, sent, failed] }
        recipient: { type: string, description: Immer serverseitig maskiert. }
        error_code: { type: string, maxLength: 200 }
        attempt_count: { type: integer, minimum: 0 }
        max_attempts: { type: integer, minimum: 1, maximum: 50 }
        updated_at: { type: string, format: date-time }
    PlanAppointmentForm:
      type: object
      required: [csrf_token, job_id, starts_at, duration_minutes, driver_id, primary_driver_id, chipper_resource_id]
      properties:
        csrf_token: { type: string, writeOnly: true }
        job_id: { type: string, format: uuid }
        starts_at: { type: string, format: local-date-time, description: Strikte Europe/Vienna-Ortszeit aus datetime-local. }
        duration_minutes: { type: integer, minimum: 15, maximum: 10080 }
        driver_id: { type: array, minItems: 1, items: { type: string, format: uuid } }
        primary_driver_id: { type: string, format: uuid }
        chipper_resource_id: { type: array, minItems: 1, items: { type: string, format: uuid } }
        transport_resource_id: { type: array, items: { type: string, format: uuid } }
        trailer_resource_id: { type: array, items: { type: string, format: uuid } }
        override_reason: { type: string, maxLength: 1000 }
        without_notification_reason: { type: string, maxLength: 1000 }
    AppointmentTimeMutation:
      type: object
      required: [csrf_token, version]
      description: Drag/Resize sendet UTC `starts_at`/`ends_at`; die mobile und tastaturbedienbare Alternative sendet `starts_at_local` plus `duration_minutes`, die der Server strikt in Europe/Vienna auflöst.
      properties:
        csrf_token: { type: string, writeOnly: true }
        version: { type: integer, minimum: 1 }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        starts_at_local: { type: string, format: local-date-time }
        duration_minutes: { type: integer, minimum: 15, maximum: 10080 }
        override_reason: { type: string, maxLength: 1000 }
    AppointmentAssignments:
      type: object
      required: [driver_id, primary_driver_id, chipper_resource_id]
      properties:
        driver_id: { type: array, minItems: 1, items: { type: string, format: uuid } }
        primary_driver_id: { type: string, format: uuid }
        chipper_resource_id: { type: array, minItems: 1, items: { type: string, format: uuid } }
        transport_resource_id: { type: array, items: { type: string, format: uuid } }
        trailer_resource_id: { type: array, items: { type: string, format: uuid } }
        override_reason: { type: string, maxLength: 1000 }
    AvailabilityInterval:
      type: object
      additionalProperties: false
      required: [starts_at, ends_at, status, source, reason]
      properties:
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        status: { type: string, enum: [available, limited, unavailable] }
        source: { type: string, enum: [none, rule, exception, inactive_driver] }
        source_type: { type: string }
        reason: { type: string, description: Minimierter deutscher Grund ohne interne Bemerkung. }
    AvailabilityResponse:
      type: object
      additionalProperties: false
      required: [driver_id, timezone, intervals]
      properties:
        driver_id: { type: string, format: uuid }
        timezone: { type: string, const: Europe/Vienna }
        intervals:
          type: array
          items: { $ref: "#/components/schemas/AvailabilityInterval" }
    VersionForm:
      type: object
      required: [csrf_token, version]
      properties:
        csrf_token: { type: string, writeOnly: true }
        version: { type: integer, minimum: 1 }
        customer_id: { type: string, format: uuid }
    ReasonedVersionForm:
      allOf:
        - $ref: "#/components/schemas/VersionForm"
        - type: object
          required: [reason]
          properties:
            reason: { type: string, minLength: 1, maxLength: 500 }
    ConfirmationResponseForm:
      type: object
      additionalProperties: false
      required: [form_nonce, action]
      properties:
        form_nonce: { type: string, writeOnly: true, pattern: "^[A-Za-z0-9_-]{43}$" }
        action: { type: string, enum: [confirmed, declined, callback_requested] }
    CustomerFields:
      type: object
      required: [notification]
      properties:
        first_name: { type: string, maxLength: 200 }
        last_name: { type: string, maxLength: 200 }
        company_name: { type: string, maxLength: 200 }
        street: { type: string, maxLength: 250 }
        postal_code: { type: string, maxLength: 32 }
        locality: { type: string, maxLength: 120 }
        region: { type: string, maxLength: 120 }
        address_freeform: { type: string, maxLength: 1000 }
        phone: { type: string, maxLength: 64 }
        email: { type: string, format: email, maxLength: 320 }
        notification: { type: string, enum: [email, sms, both, none] }
    CustomerUpdateForm:
      allOf:
        - $ref: "#/components/schemas/CustomerFields"
        - $ref: "#/components/schemas/VersionForm"
    JobForm:
      type: object
      required: [csrf_token, job_type, volume_m3, hack_duration, transport_mode, urgency, source]
      properties:
        csrf_token: { type: string, writeOnly: true }
        job_type: { type: string, enum: [chipping_only, chipping_with_transport] }
        volume_m3: { type: string, pattern: "^[0-9]+([.,][0-9]+)?$" }
        hack_duration: { type: string, description: Minuten oder Stunden:Minuten. }
        transport_duration: { type: string, description: Minuten oder Stunden:Minuten. }
        transport_trips: { type: integer, minimum: 0 }
        transport_mode: { type: string, enum: [none, internal, external, undecided] }
        external_confirmed: { type: boolean, default: false }
        preferred_start: { type: string, format: date }
        preferred_end: { type: string, format: date }
        preference_text: { type: string, maxLength: 1000 }
        urgency: { type: string, enum: [low, normal, high, urgent] }
        region: { type: string, maxLength: 120 }
        source: { type: string, enum: [phone, voice, email, in_person, other] }
        note: { type: string, maxLength: 4000 }
    CustomerIntakeForm:
      allOf:
        - $ref: "#/components/schemas/CustomerFields"
        - $ref: "#/components/schemas/JobForm"
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: hackwerk_session
