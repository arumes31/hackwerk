openapi: 3.1.0
info:
  title: HackWerk HTTP API
  version: 0.10.0
  description: Interner Vertrag des serverseitig gerenderten HackWerk-Webdienstes.
servers:
  - url: http://localhost:18533
paths:
  /search:
    post:
      operationId: searchWorkspace
      description: Authentifizierte, rollenbasierte Navigation über Kunden, Aufträge und aktive Termine. Der Suchtext bleibt im POST-Body, wird nicht gespeichert und die Antwort ist immer `no-store`.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required: [csrf_token, q]
              properties:
                csrf_token: { type: string, writeOnly: true }
                q: { type: string, minLength: 2, maxLength: 120 }
      responses:
        "200":
          description: Höchstens 24 navigierende Treffer, jeweils maximal acht pro Objektart.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [results]
                properties:
                  results:
                    type: array
                    maxItems: 24
                    items: { $ref: "#/components/schemas/WorkspaceSearchResult" }
            text/html: { schema: { type: string } }
        "403": { description: Session, Rolle oder CSRF ungültig. }
        "422": { description: Suchtext ist zu kurz oder zu lang. }
  /api/v1/geocoding/search:
    post:
      operationId: searchGeocodingCandidates
      description: Sucht über den statisch konfigurierten Geocoding-Dienst nach Kartenpositionen. Speichert weder Suchtext noch Treffer; die Browserauswahl übernimmt Adresse und Koordinaten nur gemeinsam in den lokalen Formularentwurf.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required: [query]
              properties:
                query: { type: string, minLength: 3, maxLength: 200 }
      responses:
        "200":
          description: Höchstens die konfigurierte Anzahl prüfbarer Kartentreffer; keine serverseitige Mutation.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [results]
                properties:
                  results:
                    type: array
                    maxItems: 10
                    items: { $ref: "#/components/schemas/GeocodingResult" }
        "403": { description: Session, Rolle oder CSRF ungültig. }
        "422": { description: Suchtext ist zu kurz oder zu lang. }
        "429": { description: Adresssuchlimit erreicht. }
        "502": { description: Konfigurierter Geocoding-Dienst nicht verfügbar; manuelle Karte bleibt nutzbar. }
  /api/v1/voice/drafts:
    post:
      operationId: createVoiceDraft
      description: Validiert eine begrenzte Audiodatei und speichert sie atomar als eigentümergebundenen Queue-Entwurf. Die asynchrone Verarbeitung legt weder Kunde, Auftrag, Wartelisteneintrag noch Termin an.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [idempotency_key, audio, duration_ms]
              properties:
                idempotency_key: { type: string, minLength: 16, maxLength: 128, description: Eigentümergebundener Wiederholungsschlüssel; serverseitig wird ausschließlich SHA-256 persistiert. }
                audio: { type: string, format: binary, description: WebM, Ogg, WAV oder MP4; serverseitig auf Container und Größe geprüft. }
                duration_ms: { type: integer, minimum: 1, maximum: 90000 }
      responses:
        "202":
          description: Aufnahme sicher zur asynchronen Verarbeitung angenommen.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoiceDraftCreated" }
        "403": { description: Session, Rolle oder CSRF ungültig. }
        "413": { description: Upload überschreitet das konfigurierte Limit. }
        "415": { description: Container oder MIME-Typ wird nicht unterstützt. }
        "422": { description: Datei ist leer oder die angegebene Dauer ungültig. }
        "429": { description: Benutzerbezogenes Rate- oder Parallelitätslimit erreicht. }
        "503": { description: Spracheingabe administrativ deaktiviert. }
  /api/v1/voice/drafts/{draftID}:
    get:
      operationId: getVoiceDraftStatus
      description: Liefert dem Besitzer ausschließlich Status und Version seines Entwurfs für das begrenzte Browser-Polling.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: draftID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Aktueller Entwurfsstatus.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, version]
                properties:
                  status: { type: string, enum: [recorded, transcribing, needs_review, failed, committed, expired] }
                  version: { type: integer, minimum: 1 }
        "403": { description: Session oder Rolle ungültig. }
        "404": { description: Entwurf fehlt oder gehört einem anderen Benutzer. }
  /voice/upload:
    post:
      operationId: createVoiceDraftNative
      description: JavaScript-freier, serverseitig begrenzter Datei-Upload. Prüft Same-Origin sowie den sessiongebundenen CSRF-Formwert und leitet ausschließlich zu einem Review-Entwurf weiter.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [csrf_token, idempotency_key, audio, duration_seconds]
              properties:
                csrf_token: { type: string }
                idempotency_key: { type: string, minLength: 16, maxLength: 128, description: Eigentümergebundener Wiederholungsschlüssel; serverseitig wird ausschließlich SHA-256 persistiert. }
                audio: { type: string, format: binary, description: WebM, Ogg, WAV oder MP4; serverseitig auf Container und Größe geprüft. }
                duration_seconds: { type: integer, minimum: 1, maximum: 90 }
      responses:
        "303": { description: Audio gelöscht; Weiterleitung zur menschlichen Entwurfsprüfung. }
        "403": { description: Session, Same-Origin oder CSRF ungültig. }
        "413": { description: Upload überschreitet das konfigurierte Limit. }
        "415": { description: Container oder MIME-Typ wird nicht unterstützt; Formular bleibt nutzbar. }
        "422": { description: Datei ist leer oder die angegebene Dauer ungültig; Formular bleibt nutzbar. }
        "429": { description: Benutzerbezogenes Rate- oder Parallelitätslimit erreicht. }
        "503": { description: Spracheingabe administrativ deaktiviert. }
  /voice/drafts/{draftID}/retranscribe:
    post:
      operationId: retryVoiceDraftTranscription
      description: Reiht einen fehlgeschlagenen, nicht abgelaufenen Entwurf seines Besitzers genau einmal erneut zur Transkription ein. Erzeugt weiterhin nur einen prüfbaren Entwurf.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: draftID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required: [csrf_token, version]
              properties:
                csrf_token: { type: string }
                version: { type: integer, minimum: 1 }
      responses:
        "303": { description: Neuverarbeitung eingereiht; Weiterleitung zum Entwurf. }
        "403": { description: Session, Besitzer oder CSRF ungültig. }
        "409": { description: Status, Version, Ablauf oder einmaliges Retry-Limit erlauben keine Neuverarbeitung. }
        "422": { description: Entwurfs-ID oder Version ungültig. }
  /api/v1/planning/suggestions:
    post:
      operationId: createPlanningSuggestions
      description: Erzeugt bis zu drei unverbindliche, konfliktgeprüfte Kandidaten; erzeugt keinen Termin und keine Benachrichtigung.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [job_id, csrf_token]
              properties:
                job_id: { type: string, format: uuid }
                csrf_token: { type: string }
      responses:
        "201": { description: Persistierter Planning Run mit höchstens drei erklärten Kandidaten. }
        "403": { description: Nur Administratoren dürfen Vorschläge berechnen. }
        "409": { description: Job- oder Wartelistenversion hat sich geändert. }
        "422": { description: Kein valider Slot oder ungültiger Auftrag. }
  /api/v1/planning/suggestions/{suggestionID}/adopt:
    post:
      operationId: adoptPlanningSuggestion
      description: Revalidiert Version, Ablauf, Availability und Reservations-Constraints atomar und erzeugt ausschließlich ein Proposal.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: suggestionID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "201": { description: Proposal erzeugt; keine Fixierung und keine Benachrichtigung. }
        "403": { description: Nur Administratoren dürfen Vorschläge übernehmen. }
        "409": { description: Vorschlag abgelaufen oder Daten/Slot zwischenzeitlich verändert. }
        "404": { description: Vorschlag nicht gefunden. }
  /planning/routes:
    get:
      operationId: getRoutePlanner
      description: Zeigt Administratoren alle offenen, noch nicht aktiv verplanten Aufträge mit explizitem Haufenstandort auf einer Karte.
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: Serverseitig gerenderte Auftragskarte mit Fahrer- und Ressourcenauswahl. }
        "403": { description: Nur Administratoren dürfen Routen planen. }
    post:
      operationId: createRouteDraft
      description: Optimiert ausgewählte Haufenstandorte und speichert einen unverbindlichen Routenentwurf; erzeugt keine Termine oder Nachrichten.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [job_id, driver_id, chipper_resource_id, departure_date, departure_time, start_selection, end_selection, csrf_token]
              properties:
                job_id: { type: array, minItems: 1, maxItems: 23, items: { type: string, format: uuid } }
                fixed_job_id: { type: array, maxItems: 23, items: { type: string, format: uuid }, description: Ausgewählte Stopps, deren relative Position bei Optimierung fixiert bleibt. }
                driver_id: { type: string, format: uuid }
                chipper_resource_id: { type: string, format: uuid }
                transport_resource_id: { type: string, format: uuid }
                departure_date: { type: string, format: date, description: Lokales Datum in Europe/Vienna. }
                departure_time: { type: string, pattern: "^[0-2][0-9]:[0-5][0-9]$", description: Lokale Uhrzeit in Europe/Vienna. }
                optimize: { type: boolean, default: true }
                start_selection: { type: string, description: "Gespeicherter Ort als saved:<uuid> oder immer verfügbare individuelle Auswahl custom." }
                end_selection: { type: string, description: "Gespeicherter Ort als saved:<uuid>, individuelle Auswahl custom oder last_stop." }
                start_location_id: { type: string, format: uuid, description: Bei gespeicherter Auswahl serverseitig mit Auswahl und Version abgeglichen. }
                start_location_version: { type: integer, minimum: 1 }
                end_location_id: { type: string, format: uuid, description: Bei gespeicherter Auswahl serverseitig mit Auswahl und Version abgeglichen. }
                end_location_version: { type: integer, minimum: 1 }
                start_custom_label: { type: string, maxLength: 120 }
                start_custom_address: { type: string, maxLength: 500 }
                start_custom_confirmed: { type: boolean, description: Muss für einen individuellen Startort ausdrücklich true sein. }
                end_custom_label: { type: string, maxLength: 120 }
                end_custom_address: { type: string, maxLength: 500 }
                end_custom_confirmed: { type: boolean, description: Muss für einen individuellen Endort ausdrücklich true sein. }
                start_latitude: { type: number, minimum: -90, maximum: 90 }
                start_longitude: { type: number, minimum: -180, maximum: 180 }
                end_latitude: { type: number, minimum: -90, maximum: 90 }
                end_longitude: { type: number, minimum: -180, maximum: 180 }
                csrf_token: { type: string }
      responses:
        "303": { description: Routenentwurf berechnet. }
        "403": { description: Nur Administratoren dürfen Routen planen. }
        "409": { description: Auftrags- oder Wartelistendaten wurden parallel verändert. }
        "422": { description: Auswahl, Standort oder Routingdaten ungültig. }
  /settings/route-locations:
    get:
      operationId: getRouteLocationSettings
      description: Zeigt Administratoren aktive und deaktivierte Routenorte sowie die aktuellen Standard-Vorauswahlen.
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: Serverseitig gerenderte Routenort-Einstellungen. }
        "403": { description: Nur Administratoren dürfen Routenorte verwalten. }
    post:
      operationId: createRouteLocation
      description: Speichert einen ausdrücklich bestätigten Routenort und setzt optional atomar den Standard für Start und/oder Ende.
      security: [{ sessionCookie: [] }]
      responses:
        "303": { description: Routenort gespeichert. }
        "403": { description: Nur Administratoren dürfen Routenorte verwalten. }
        "422": { description: Bezeichnung, Adresse, Koordinaten oder Bestätigung ungültig. }
  /settings/route-locations/{routeLocationID}:
    post:
      operationId: updateRouteLocation
      description: Aktualisiert einen aktiven Routenort mit optimistischer Versionierung und optionaler Standard-Vorauswahl.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: routeLocationID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "303": { description: Routenort aktualisiert. }
        "409": { description: Routenort wurde parallel geändert. }
        "422": { description: Änderung wurde nicht ausdrücklich bestätigt oder ist ungültig. }
  /settings/route-locations/{routeLocationID}/deactivate:
    post:
      operationId: deactivateRouteLocation
      description: Deaktiviert einen Routenort. Das Entfernen eines aktuellen Standards verlangt eine zusätzliche Bestätigung.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: routeLocationID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "303": { description: Routenort deaktiviert. }
        "409": { description: Routenort wurde parallel geändert. }
        "422": { description: Bestätigung zum Entfernen des Standards fehlt. }
  /planning/routes/{routeID}/assign:
    post:
      operationId: assignRouteDraft
      description: Revalidiert die vollständige Route atomar und erzeugt je Stopp ausschließlich ein Proposal; keine Fixierung und kein Versand.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: routeID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "303": { description: Route als unverbindliche Terminvorschläge zugewiesen. }
        "403": { description: Nur Administratoren dürfen Routen zuweisen. }
        "409": { description: Route, Auftrag, Warteliste, Fahrer oder Ressource hat sich verändert beziehungsweise überschneidet sich. }
  /planning/routes/{routeID}/move-stop:
    post:
      operationId: moveDraftRouteStop
      description: Verschiebt einen Stopp atomisch zwischen zwei Routenentwürfen, prüft beide Versionen und berechnet beide Strecken neu. Erzeugt keine Termine.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: routeID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "303": { description: Beide Entwürfe wurden aktualisiert. }
        "403": { description: Nur Administratoren dürfen Routenentwürfe ändern. }
        "409": { description: Mindestens eine Routenversion oder ein Stopp wurde parallel geändert. }
  /my-route:
    get:
      operationId: getOwnRoute
      description: Zeigt einem Fahrer ausschließlich die eigene zugewiesene Route eines lokalen Arbeitstags.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: date, in: query, required: false, schema: { type: string, format: date } }
      responses:
        "200": { description: Eigene Route oder leerer Zustand. }
        "403": { description: Kein zugeordnetes Fahrerprofil. }
  /my-route/{routeID}/reorder:
    post:
      operationId: reorderOwnRoute
      description: Ändert ausschließlich die Stoppfolge der eigenen zugewiesenen Route. Auftragsmenge, Zugehörigkeit, Fahrer, Ressourcen und Terminzeiten bleiben unverändert.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: routeID, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [stop_id, version, csrf_token]
              properties:
                stop_id: { type: array, minItems: 1, maxItems: 23, items: { type: string, format: uuid } }
                version: { type: integer, minimum: 1 }
                csrf_token: { type: string }
      responses:
        "303": { description: Fahrreihenfolge gespeichert und Strecke neu berechnet. }
        "403": { description: Route gehört nicht zum angemeldeten Fahrer. }
        "409": { description: Routenversion wurde parallel geändert. }
        "422": { description: Stoppmenge ist keine exakte Permutation der Route. }
  /calendar/export.ics:
    get:
      operationId: exportCalendarICS
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: detail, in: query, required: false, schema: { type: string, enum: [internal, minimal] } }
      responses:
        "200": { description: Begrenzter read-only iCalendar-Download. }
        "422": { description: Datumsbereich ungültig oder zu groß. }
  /api/v1/calendar-feeds:
    get:
      operationId: listCalendarFeeds
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: Eigene Feeds ohne Roh-Token. }
    post:
      operationId: createCalendarFeed
      description: Erzeugt einen privaten Rohlink, der ausschließlich in dieser Antwort vollständig erscheint.
      security: [{ sessionCookie: [] }]
      responses:
        "201": { description: Feed und einmalig sichtbare URL erzeugt. }
        "422": { description: Filter ungültig. }
  /api/v1/calendar-feeds/{calendarFeedID}/rotate:
    post:
      operationId: rotateCalendarFeed
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: calendarFeedID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Alter Token atomar ersetzt; neue URL einmal sichtbar. }
        "409": { description: Version veraltet. }
  /api/v1/calendar-feeds/{calendarFeedID}:
    delete:
      operationId: revokeCalendarFeed
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: calendarFeedID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Feed widerrufen. }
        "409": { description: Version veraltet. }
  /feeds/{calendarFeedToken}/calendar.ics:
    get:
      operationId: getPrivateCalendarFeed
      description: Öffentlicher read-only Capability-Abruf ohne Sessioncookie; Token wird nur gehasht gespeichert und in Logs redigiert.
      parameters:
        - { name: calendarFeedToken, in: path, required: true, schema: { type: string, minLength: 40, maxLength: 100 } }
      responses:
        "200": { description: Gefilterter iCalendar-Feed mit ETag und Last-Modified. }
        "304": { description: Inhalt gemäß ETag unverändert. }
        "404": { description: Einheitlich für ungültig, widerrufen, abgelaufen oder Owner deaktiviert. }
        "429": { description: Kalenderclient-tolerantes Abruflimit erreicht. }
  /dashboard:
    get:
      operationId: getDashboard
      description: Rollenprojizierter, read-only Tagesüberblick mit begrenztem Folge-Horizont.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: date
          in: query
          required: false
          description: Lokaler Tag in Europe/Vienna; ohne Wert wird heute verwendet.
          schema: { type: string, format: date }
      responses:
        "200": { description: Serverseitig gerendertes Dashboard für Admin oder Fahrer. }
        "401": { description: Anmeldung erforderlich. }
        "422": { description: Datum ungültig oder außerhalb der begrenzten Auswahl. }
        "500": { description: Recoverable Fehlerzustand ohne interne Datenbankdetails. }
  /login:
    get:
      operationId: getLogin
      responses:
        "200": { description: Deutsches Anmeldeformular. }
    post:
      operationId: postLogin
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password, writeOnly: true }
      responses:
        "303": { description: Anmeldung erfolgreich; neue opaque Session wurde angelegt oder der zweite Faktor wird angefordert. }
        "401": { description: Generische ungültige Zugangsdaten. }
        "429": { description: Loginlimit erreicht, mit derselben generischen sichtbaren Meldung. }
  /login/mfa:
    get:
      operationId: getSecondFactor
      security: [{ mfaCookie: [] }]
      responses:
        "200": { description: Zweiter Login-Schritt mit den eingerichteten TOTP-, Passkey- und Recovery-Optionen. }
        "303": { description: Challenge fehlt oder ist abgelaufen; zurück zur Anmeldung. }
    post:
      operationId: completeSecondFactor
      security: [{ mfaCookie: [] }]
      description: Verbraucht einen gültigen TOTP- oder Recovery-Code atomar und erzeugt erst danach eine reguläre Sitzung.
      responses:
        "303": { description: Zweiter Faktor gültig; neue parallele Sitzung angelegt. }
        "401": { description: Generischer Fehler ohne Preisgabe von Faktor- oder Kontostatus. }
  /login/mfa/passkey/options:
    post:
      operationId: beginPasskeyLogin
      security: [{ mfaCookie: [] }]
      responses:
        "200": { description: Kurzlebige, serverseitig gebundene WebAuthn-Assertion-Optionen. }
        "401": { description: Challenge ungültig oder Passkey nicht verfügbar. }
  /login/mfa/passkey/finish:
    post:
      operationId: finishPasskeyLogin
      security: [{ mfaCookie: [] }]
      responses:
        "200": { description: Assertion einmalig akzeptiert und reguläre Sitzung angelegt. }
        "401": { description: Assertion generisch abgelehnt. }
  /profil/email/bestaetigen:
    get:
      operationId: verifyOwnEmailChange
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 256 }
      responses:
        "303": { description: Einmaliger Link akzeptiert; neue normalisierte E-Mail-Adresse aktiv. }
        "410": { description: Link abgelaufen. }
        "422": { description: Link ungültig oder bereits verwendet. }
  /logout:
    post:
      operationId: postLogout
      security: [{ sessionCookie: [] }]
      responses:
        "303": { description: Session serverseitig widerrufen. }
        "403": { description: CSRF-Prüfung fehlgeschlagen. }
  /password:
    get:
      operationId: getPasswordChange
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: Passwortänderungsformular. }
    post:
      operationId: postPasswordChange
      security: [{ sessionCookie: [] }]
      responses:
        "303": { description: Passwort geändert und bestehende Sessions widerrufen. }
        "403": { description: CSRF-Prüfung fehlgeschlagen. }
        "422": { description: Passwortpolicy oder Bestätigung ungültig. }
  /profile:
    get:
      operationId: getOwnProfile
      security: [{ sessionCookie: [] }]
      responses:
