name: hackwerk-voice-host

services:
  whisper:
    image: ${WHISPER_IMAGE:?WHISPER_IMAGE setzen}
    entrypoint: ["/app/build/bin/whisper-server"]
    command: ["--model", "/app/models/ggml-small.bin", "--host", "0.0.0.0", "--port", "8080", "--threads", "${WHISPER_THREADS:-2}", "--processors", "1", "--language", "de", "--convert", "--tmp-dir", "/tmp", "--no-gpu", "--suppress-nst"]
    ports:
      - ${WHISPER_BIND_ADDRESS:?Numerische Tailscale-IP setzen}:8080:8080
    read_only: true
    user: "65532:65532"
    tmpfs: ["/tmp:size=64m,mode=1777,noexec,nosuid,nodev"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 128
    cpus: "2.00"
    mem_limit: 2g
    memswap_limit: 2g
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped
