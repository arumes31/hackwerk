services:
  app:
    image: registry.example.invalid/hackwerk:1.0.0
    environment: &production-environment
      APP_ENV: production
      APP_BASE_URL: https://hackwerk.example.invalid
      DATABASE_URL_FILE: /run/secrets/database_url
    secrets: [database_url]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: always

  worker:
    image: registry.example.invalid/hackwerk:1.0.0
    command: ["worker"]
    environment: *production-environment
    secrets: [database_url]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: always

secrets:
  database_url:
    file: ./secrets/database_url
