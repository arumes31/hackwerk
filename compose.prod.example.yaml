name: hackwerk-production

x-runtime-environment: &runtime-environment
  APP_ENV: production
  APP_NAME: HackWerk
  APP_BASE_URL: https://${APP_HOST:?APP_HOST setzen}
  APP_LISTEN_ADDR: :18533
  APP_ALLOWED_HOSTS: ${APP_HOST}
  APP_TRUSTED_PROXY_CIDRS: ${APP_TRUSTED_PROXY_CIDRS:-172.30.0.0/24}
  APP_LOG_FORMAT: json
  APP_LOG_LEVEL: ${APP_LOG_LEVEL:-info}
  SESSION_COOKIE_SECURE: "true"
  DATABASE_URL_FILE: /run/secrets/database_url
  CONFIRMATION_TOKEN_KEY_ID: ${CONFIRMATION_TOKEN_KEY_ID:?Token-Key-ID setzen}
  CONFIRMATION_TOKEN_KEYS_FILE: /run/secrets/confirmation_token_keys
  MAIL_ENABLED: ${MAIL_ENABLED:-false}
  SMS_ENABLED: ${SMS_ENABLED:-false}
  VOICE_ENABLED: ${VOICE_ENABLED:-false}
  VOICE_TRANSCRIBER: ${VOICE_TRANSCRIBER:-disabled}
  VOICE_EXTRACTOR: ${VOICE_EXTRACTOR:-rules}
  VOICE_TEMP_DIR: /tmp/hackwerk-voice
  CALENDAR_ENABLED: ${CALENDAR_ENABLED:-true}
  CALENDAR_UID_DOMAIN: ${CALENDAR_UID_DOMAIN:-hackwerk.local}
  PLANNING_ROUTER: ${PLANNING_ROUTER:-haversine}
  PLANNING_ROUTING_URL: ${PLANNING_ROUTING_URL:-}
  MAP_TILE_URL: ${MAP_TILE_URL:?MAP_TILE_URL setzen}
  MAP_TILE_ATTRIBUTION: ${MAP_TILE_ATTRIBUTION:?MAP_TILE_ATTRIBUTION setzen}
  WORKER_HEARTBEAT_STALE_AFTER: ${WORKER_HEARTBEAT_STALE_AFTER:-2m}

x-runtime-security: &runtime-security
  read_only: true
  user: "65532:65532"
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  ulimits:
    nofile: {soft: 4096, hard: 4096}
  restart: unless-stopped

services:
  postgres:
    image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_DB: hackwerk
      POSTGRES_USER: hackwerk_bootstrap
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_bootstrap_password
      HACKWERK_MIGRATION_PASSWORD_FILE: /run/secrets/postgres_migration_password
      HACKWERK_RUNTIME_PASSWORD_FILE: /run/secrets/postgres_runtime_password
    secrets: [postgres_bootstrap_password, postgres_migration_password, postgres_runtime_password]
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./scripts/postgres/init-prod.sh:/docker-entrypoint-initdb.d/20-hackwerk-roles.sh:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackwerk_bootstrap -d hackwerk"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    pids_limit: 256
    restart: unless-stopped

  migrate:
    image: ${HACKWERK_IMAGE:?HACKWERK_IMAGE setzen}
    command: ["migrate", "up"]
    environment:
      <<: *runtime-environment
      DATABASE_URL_FILE: /run/secrets/migration_database_url
      MAIL_ENABLED: "false"
      SMS_ENABLED: "false"
      VOICE_ENABLED: "false"
      METRICS_ENABLED: "false"
    secrets: [migration_database_url, confirmation_token_keys]
    networks: [backend]
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 64
    restart: "no"
    profiles: [deploy]

  osrm:
    image: ${OSRM_IMAGE:?OSRM_IMAGE mit unveraenderlichem Digest setzen}
    command: ["osrm-routed", "--threads", "2", "--algorithm", "mld", "--mmap", "--max-table-size", "25", "/data/current/route.osrm"]
    volumes:
      - ${OSRM_DATA_DIR:?OSRM_DATA_DIR setzen}:/data:ro
    networks: [routing]
    read_only: true
    user: "65532:65532"
    tmpfs: ["/tmp:size=32m,mode=1777,noexec,nosuid,nodev"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 128
    restart: unless-stopped
    deploy:
      resources:
        limits: {cpus: "1.50", memory: 3G, pids: 128}
        reservations: {memory: 512M}
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --max-time 5 'http://127.0.0.1:5000/route/v1/driving/14.2858,48.3069;14.3000,48.3100?overview=false' | grep -q '\"code\":\"Ok\"'"]
      interval: 15s
      timeout: 6s
      retries: 8
      start_period: 30s

  osrm-update:
    image: ${OSRM_IMAGE:?OSRM_IMAGE mit unveraenderlichem Digest setzen}
    command: ["ionice", "-c", "3", "nice", "-n", "15", "/usr/local/bin/hackwerk-osrm-update"]
    environment:
      OSRM_DATA_ROOT: /data
      OSRM_BBOX: ${OSRM_BBOX:-9.4,46.3,17.5,49.5}
      OSRM_MIN_FREE_KB: ${OSRM_MIN_FREE_KB:-20971520}
      OSRM_THREADS: ${OSRM_THREADS:-2}
      OSRM_DOWNLOAD_LIMIT: ${OSRM_DOWNLOAD_LIMIT:-4M}
    volumes:
      - ${OSRM_DATA_DIR:?OSRM_DATA_DIR setzen}:/data
    networks: [egress]
    read_only: true
    user: "65532:65532"
    tmpfs: ["/tmp:size=64m,mode=1777,noexec,nosuid,nodev"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 512
    blkio_config:
      weight: 100
    profiles: [osrm-ops]
    restart: "no"
    deploy:
      resources:
        limits: {cpus: "2.50", memory: 5G, pids: 512}
        reservations: {memory: 512M}

  app:
    image: ${HACKWERK_IMAGE:?HACKWERK_IMAGE setzen}
    command: ["serve"]
    environment:
      <<: *runtime-environment
      VOICE_OPENAI_API_KEY_FILE: /run/secrets/voice_openai_api_key
      MAP_TILE_TOKEN_FILE: /run/secrets/map_tile_token
      METRICS_ENABLED: "true"
      METRICS_LISTEN_ADDR: 172.33.0.10:19090
    secrets: [database_url, confirmation_token_keys, voice_openai_api_key, map_tile_token]
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["127.0.0.1:18533:18533"]
    networks:
      frontend: {ipv4_address: 172.30.0.10}
      backend: {}
      egress: {}
      routing: {}
      monitoring: {ipv4_address: 172.33.0.10}
    tmpfs: ["/tmp:size=64m,mode=1777,noexec,nosuid,nodev"]
    <<: *runtime-security
    deploy:
      resources:
        limits: {cpus: "1.00", memory: 512M, pids: 128}
        reservations: {memory: 128M}
    healthcheck:
      test: ["CMD", "/hackwerk", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  worker:
    image: ${HACKWERK_IMAGE:?HACKWERK_IMAGE setzen}
    command: ["worker"]
    environment:
      <<: *runtime-environment
      VOICE_ENABLED: "false"
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-587}
      MAIL_SMTP_TLS: ${MAIL_SMTP_TLS:-starttls}
      MAIL_SMTP_USERNAME_FILE: /run/secrets/mail_smtp_username
      MAIL_SMTP_PASSWORD_FILE: /run/secrets/mail_smtp_password
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-HackWerk}
      SMS_PROVIDER: ${SMS_PROVIDER:-sendberry}
      SMS_WEBHOOK_URL: ${SMS_WEBHOOK_URL:-}
      SMS_WEBHOOK_HMAC_SECRET_FILE: /run/secrets/sms_webhook_hmac_secret
      SENDBERRY_API_URL: ${SENDBERRY_API_URL:-}
      SENDBERRY_API_KEY_FILE: /run/secrets/sendberry_api_key
      SENDBERRY_ACCESS_NAME_FILE: /run/secrets/sendberry_access_name
      SENDBERRY_ACCESS_PASSWORD_FILE: /run/secrets/sendberry_access_password
      SMS_SENDER: ${SMS_SENDER:-}
      SMS_TIMEOUT: ${SMS_TIMEOUT:-8s}
      SMS_MAX_ATTEMPTS: ${SMS_MAX_ATTEMPTS:-6}
      METRICS_ENABLED: "false"
    secrets:
      - database_url
      - confirmation_token_keys
      - mail_smtp_username
      - mail_smtp_password
      - sendberry_api_key
      - sendberry_access_name
      - sendberry_access_password
      - sms_webhook_hmac_secret
    depends_on:
      postgres: {condition: service_healthy}
    networks: [backend, egress]
    tmpfs: ["/tmp:size=16m,mode=1777,noexec,nosuid,nodev"]
    <<: *runtime-security
    deploy:
      resources:
        limits: {cpus: "1.00", memory: 384M, pids: 128}
        reservations: {memory: 96M}
    healthcheck:
      test: ["CMD", "/hackwerk", "healthcheck", "worker"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s

  backup:
    image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    entrypoint: ["/bin/sh", "/opt/hackwerk/backup-postgres.sh"]
    environment:
      DATABASE_URL_FILE: /run/secrets/backup_database_url
      BACKUP_DIR: /backups
    secrets: [backup_database_url]
    volumes:
      - backups:/backups
      - ./scripts/ops:/opt/hackwerk:ro
    networks: [backend]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777,noexec,nosuid,nodev"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    profiles: [ops]

volumes:
  postgres-data:
  backups:

networks:
  frontend:
    ipam:
      config: [{subnet: 172.30.0.0/24}]
  backend:
    internal: true
  egress:
  monitoring:
    internal: true
    ipam:
      config: [{subnet: 172.33.0.0/24}]
  routing:
    internal: true

secrets:
  database_url: {file: ./secrets/database_url}
  migration_database_url: {file: ./secrets/migration_database_url}
  backup_database_url: {file: ./secrets/backup_database_url}
  confirmation_token_keys: {file: ./secrets/confirmation_token_keys}
  postgres_bootstrap_password: {file: ./secrets/postgres_bootstrap_password}
  postgres_migration_password: {file: ./secrets/postgres_migration_password}
  postgres_runtime_password: {file: ./secrets/postgres_runtime_password}
  mail_smtp_username: {file: ./secrets/mail_smtp_username}
  mail_smtp_password: {file: ./secrets/mail_smtp_password}
  sendberry_api_key: {file: ./secrets/sendberry_api_key}
  sendberry_access_name: {file: ./secrets/sendberry_access_name}
  sendberry_access_password: {file: ./secrets/sendberry_access_password}
  voice_openai_api_key: {file: ./secrets/voice_openai_api_key}
  map_tile_token: {file: ./secrets/map_tile_token}
  sms_webhook_hmac_secret: {file: ./secrets/sms_webhook_hmac_secret}
